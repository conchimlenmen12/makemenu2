name: Build lara IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Build IPA
        run: |
          cd lara-0.2
          bash scripts/build_ipa.sh
      
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: lara-ipa
          path: lara-0.2/lara.ipa
