name: build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26

    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: setup xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: show xcode version
        run: |
          xcodebuild -version
          xcode-select -p
          swift --version

      - name: install ldid
        run: |
          brew update
          brew install ldid
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
          export PATH="$(brew --prefix)/bin:$PATH"
          echo "===== LDID ====="
          which ldid
          ldid --version || true

      - name: build
        run: |
          cd lara-0.2
          chmod +x scripts/build_ipa.sh
          export PATH="$(brew --prefix)/bin:$PATH"
          echo "===== LDID BEFORE BUILD ====="
          which ldid
          ldid --version || true
          echo "===== BUILD ====="
          ./scripts/build_ipa.sh

      - name: show build files
        if: always()
        run: |
          echo "===== BUILD DIRECTORY ====="
          find lara-0.2/build -maxdepth 3 -type f -print 2>/dev/null || true

      - name: upload artifact (PR only)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: lara-ipa
          path: |
            lara-0.2/build/lara.ipa
            lara-0.2/build/xcodebuild.log
          if-no-files-found: error

      - name: upload release ipa
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: release-ipa
          path: lara-0.2/build/lara.ipa
          if-no-files-found: error

  release:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: download ipa
        uses: actions/download-artifact@v4
        with:
          name: release-ipa
          path: build/

      - name: get last 12h commits
        run: |
          COMMITS=$(git log --since="12 hours ago" --pretty=format:"- %h %s (%an)")
          if [ -z "$COMMITS" ]; then
            COMMITS="no commits in the last 12 hours"
          fi

          echo "COMMITS<<EOF" >> "$GITHUB_ENV"
          echo "$COMMITS" >> "$GITHUB_ENV"
          echo "EOF"

      - name: write release notes
        run: |
          cat <<EOF > release_notes.txt
          lara nightly build

          Last 12 hours commits:

          ${COMMITS}
          EOF

      - name: update nightly release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view nightly >/dev/null 2>&1 || \
          gh release create nightly \
            --title "Nightly" \
            --notes "initial nightly" \
            --prerelease

          gh release edit nightly \
            --title "Nightly" \
            --notes-file release_notes.txt \
            --prerelease

          gh release upload nightly build/lara.ipa --clobber
