name: build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26

    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: setup xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: show xcode version
        run: |
          xcodebuild -version
          xcode-select -p
          swift --version

      - name: build
        run: |
          cd lara-0.2
          chmod +x scripts/build_ipa.sh
          ./scripts/build_ipa.sh

      - name: show build files
        if: always()
        run: |
          echo "===== BUILD DIRECTORY ====="
          find lara-0.2/build -maxdepth 3 -type f -print 2>/dev/null || true

      - name: upload artifact (PR only)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: lara-ipa
          path: |
            lara-0.2/build/lara.ipa
            lara-0.2/build/xcodebuild.log
          if-no-files-found: error

      - name: upload release ipa
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: release-ipa
          path: lara-0.2/build/lara.ipa
          if-no-files-found: error

  release:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: download ipa
        uses: actions/download-artifact@v4
        with:
          name: release-ipa
          path: build

      - name: write release notes
        run: |
          echo "lara nightly build" > release_notes.txt
          echo "" >> release_notes.txt
          echo "Last 12 hours commits:" >> release_notes.txt
          echo "" >> release_notes.txt

          COMMITS=$(git log --since="12 hours ago" --pretty=format:"- %h %s (%an)")

          if [ -z "$COMMITS" ]; then
            echo "no commits in the last 12 hours" >> release_notes.txt
          else
            printf '%s\n' "$COMMITS" >> release_notes.txt
          fi

          echo "===== RELEASE NOTES ====="
          cat release_notes.txt

      - name: update nightly release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view nightly >/dev/null 2>&1; then
            echo "Nightly release already exists"
          else
            echo "Creating nightly release..."
            gh release create nightly \
              --title "Nightly" \
              --notes "initial nightly" \
              --prerelease
          fi

          echo "Updating nightly release notes..."

          gh release edit nightly \
            --title "Nightly" \
            --notes-file release_notes.txt \
            --prerelease

          echo "Uploading IPA..."

          gh release upload nightly \
            build/lara.ipa \
            --clobber

          echo "===== RELEASE COMPLETE ====="
          gh release view nightly
